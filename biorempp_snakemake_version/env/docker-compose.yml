services:
  snakemake:
    build:
      context: ..
      dockerfile: env/Dockerfile
    container_name: biorempp-snakemake
    working_dir: /workspace/biorempp_snakemake_version
    volumes:
      - ../../:/workspace
    environment:
      - TZ=UTC
    command: >
      snakemake --snakefile Snakefile --configfile config/config.yaml --cores 2 --printshellcmds

  validation:
    build:
      context: ../..
      dockerfile: biorempp_validation/env/Dockerfile
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    environment:
      - TZ=UTC
    command:
      - biorempp-validate
      - --config
      - biorempp_validation/config/validation.yaml
