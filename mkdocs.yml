# mkdocs.yml - BioRemPP Database Official Documentation Configuration
site_name: BioRemPP Database Documentation
site_url: https://biorempp-database.readthedocs.io
site_description: >-
  BioRemPP Database - Comprehensive biological remediation database.
  Integrating KEGG, environmental agencies, manual curations, and
  enzyme activity classifications for bioremediation research.

repo_url: https://github.com/BioRemPP/biorempp_db
repo_name: biorempp_db

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  font:
    text: Roboto
    code: Roboto Mono
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  
  # logo: assets/logo.png
  # favicon: assets/favicon.png

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version:
    provider: mike
    default: 1.1.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BioRemPP/biorempp_db
    - icon: fontawesome/solid/envelope
      link: mailto:biorempp@gmail.com

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Requirements: getting-started/requirements.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Input Data Contract: user-guide/input-data.md
      - Running The Snakemake Pipeline: user-guide/run-snakemake.md
      - Understanding Outputs: user-guide/understanding-output.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Pipeline Architecture:
      - Overview: pipeline-architecture/overview.md
      - Execution Stages: pipeline-architecture/execution-stages.md
      - Rules And Scripts Map: pipeline-architecture/rules-and-scripts.md
      - Configuration And IO Contracts: pipeline-architecture/configuration-and-io.md
  - Database Reference:
      - Schema: database-reference/schema.md
      - Curated Inputs: database-reference/curated-inputs.md
      - Analysis Artifacts: database-reference/analysis-artifacts.md
      - Provenance And Release Semantics: database-reference/provenance-and-release.md
  - Pipeline Validation:
      - Overview: pipeline-validation/overview.md
      - KEGG Link Cache: pipeline-validation/kegg-link-cache.md
      - Keys Consistency Report: pipeline-validation/keys-consistency.md
      - Links Groundtruth Policy Report: pipeline-validation/links-groundtruth-policy.md
  - Data Validation (GX):
      - Architecture: validation-gx/architecture.md
      - Expectation Suites: validation-gx/expectation-suites.md
      - Validation Modes: validation-gx/validation-modes.md
      - Configuration Reference: validation-gx/configuration.md
      - Baseline Management: validation-gx/baseline-management.md
      - Testing: validation-gx/testing.md
  - Reference:
      - Data Sources: reference/data-sources.md
      - Glossary: reference/glossary.md
  - About:
      - Project Scope: about/project-scope.md
      - Contributing: about/contributing.md
      - Changelog And Releases: about/changelog-and-releases.md
